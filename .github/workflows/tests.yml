name: Test, package, and preserve Udacity starter assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Retrieve original Udacity binary assets if absent
        run: |
          set -euo pipefail
          mkdir -p assets python-package/employee_events python-package/dist
          if [ ! -s assets/model.pkl ]; then
            curl --fail --location --retry 3 --silent --show-error \
              https://raw.githubusercontent.com/udacity/dsnd-dashboard-project/main/assets/model.pkl \
              -o assets/model.pkl
          fi
          if [ ! -s python-package/employee_events/employee_events.db ]; then
            curl --fail --location --retry 3 --silent --show-error \
              https://raw.githubusercontent.com/udacity/dsnd-dashboard-project/main/python-package/employee_events/employee_events.db \
              -o python-package/employee_events/employee_events.db
          fi
          python - <<'PY'
          from pathlib import Path
          db = Path("python-package/employee_events/employee_events.db")
          assert db.read_bytes().startswith(b"SQLite format 3\x00")
          assert Path("assets/model.pkl").stat().st_size > 100
          print("Verified official Udacity SQLite database and model file.")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Build required source distribution
        run: |
          cd python-package
          python setup.py sdist --dist-dir dist
          test -f dist/employee_events-0.1.0.tar.gz

      - name: Run database and package tests
        run: python -m pytest -q

      - name: Compile dashboard and modules
        run: |
          python -m compileall -q report python-package/employee_events
          python - <<'PY'
          import sys
          sys.path.insert(0, "report")
          import dashboard
          assert dashboard.app is not None
          print("Dashboard imports and initializes successfully.")
          PY

      - name: Commit official assets and built package on first run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f assets/model.pkl \
            python-package/employee_events/employee_events.db \
            python-package/dist/employee_events-0.1.0.tar.gz
          if ! git diff --cached --quiet; then
            git commit -m "Preserve Udacity original assets and packaged sdist [skip ci]"
            git push origin HEAD:main
          fi
